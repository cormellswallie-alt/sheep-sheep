plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minis.sheep'
    compileSdk 34

    defaultConfig {
        applicationId 'com.minis.sheep'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 使用 debug 签名，方便直接安装
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
